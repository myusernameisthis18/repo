name: Build Minecraft Plugin
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      # Dieser Schritt entpackt Ihren Ordner automatisch in der Cloud
      - name: Projekt-ZIP entpackt
        run: |
          unzip -o *.zip
          ls -la # Zeigt die Ordnerstruktur im Log zur Kontrolle

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Mit Maven kompilieren
        run: mvn clean package

      - name: Fertige JAR-Datei bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: "**/target/*.jar" # Findet die JAR, egal in welchem Unterordner sie entpackt wurde
